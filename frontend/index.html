<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Useful Work Token - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .task-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .task-id {
            font-family: monospace;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }

        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-pending {
            background: #ffc107;
            color: #000;
        }

        .status-in_progress {
            background: #2196f3;
            color: white;
        }

        .status-completed {
            background: #4caf50;
            color: white;
        }

        .status-verified {
            background: #9c27b0;
            color: white;
        }

        .status-failed {
            background: #f44336;
            color: white;
        }

        .task-output {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3c3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Proof of Useful Work Token</h1>
            <p class="subtitle">AI Labor Backed Cryptocurrency - MVP Demo</p>
        </header>

        <div class="grid">
            <!-- Submit Task -->
            <div class="card">
                <h2>📝 Submit Task</h2>
                <div id="submitMessage"></div>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="wallet">Your Wallet Address</label>
                        <input type="text" id="wallet" placeholder="0x..." required>
                    </div>
                    <div class="form-group">
                        <label for="description">Task Description</label>
                        <textarea id="description" placeholder="What should the AI agent do?" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn">Submit Task</button>
                </form>
            </div>

            <!-- Agent Stats -->
            <div class="card">
                <h2>📊 Agent Statistics</h2>
                <div id="agentStatsMessage"></div>
                <div class="form-group">
                    <label for="agentWallet">Agent Wallet</label>
                    <input type="text" id="agentWallet" placeholder="0x...">
                    <button onclick="loadAgentStats()" style="margin-top: 10px; width: 100%;">Load Stats</button>
                </div>
                <div id="statsContainer" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Recent Tasks -->
        <div class="card">
            <h2>📋 Recent Tasks</h2>
            <button onclick="loadTasks()" style="margin-bottom: 20px;">Refresh</button>
            <div id="tasksContainer">
                <div class="loading">Loading tasks...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Submit task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('submitMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requester_wallet: document.getElementById('wallet').value,
                        description: document.getElementById('description').value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="success">✓ Task submitted! ID: ${data.task.id}</div>`;
                    document.getElementById('description').value = '';
                    loadTasks();
                } else {
                    messageDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Task';
            }
        });

        // Load tasks
        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '<div class="loading">Loading tasks...</div>';

            try {
                const response = await fetch(`${API_URL}/tasks?limit=10`);
                const data = await response.json();

                if (data.tasks.length === 0) {
                    container.innerHTML = '<div class="empty-state">No tasks yet. Submit one above!</div>';
                    return;
                }

                container.innerHTML = data.tasks.map(task => `
                    <div class="task-item">
                        <div class="task-id">ID: ${task.id}</div>
                        <div>
                            <span class="task-status status-${task.status}">${task.status}</span>
                        </div>
                        <div style="margin: 10px 0;">
                            <strong>Description:</strong> ${task.description.substring(0, 100)}${task.description.length > 100 ? '...' : ''}
                        </div>
                        <div style="font-size: 0.9rem; color: #666;">
                            <div>Requester: ${task.requester_wallet}</div>
                            ${task.agent_wallet ? `<div>Agent: ${task.agent_wallet}</div>` : ''}
                            ${task.compute_tokens_used > 0 ? `<div>Compute tokens: ${task.compute_tokens_used}</div>` : ''}
                            <div>Created: ${new Date(task.created_at).toLocaleString()}</div>
                        </div>
                        ${task.output_text ? `
                            <div class="task-output">
                                <strong>Output:</strong><br>
                                ${task.output_text.substring(0, 300)}${task.output_text.length > 300 ? '...' : ''}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading tasks: ${error.message}</div>`;
            }
        }

        // Load agent stats
        async function loadAgentStats() {
            const wallet = document.getElementById('agentWallet').value;
            const container = document.getElementById('statsContainer');
            const messageDiv = document.getElementById('agentStatsMessage');

            messageDiv.innerHTML = '';

            if (!wallet) {
                messageDiv.innerHTML = '<div class="error">Please enter an agent wallet address</div>';
                return;
            }

            container.innerHTML = '<div class="loading">Loading stats...</div>';

            try {
                const response = await fetch(`${API_URL}/tasks/stats/agent/${wallet}`);
                const stats = await response.json();

                container.innerHTML = `
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value">${stats.total_tasks_completed || 0}</div>
                            <div class="stat-label">Tasks Completed</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${(stats.total_compute_tokens || 0).toLocaleString()}</div>
                            <div class="stat-label">Compute Tokens</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${(stats.total_tokens_earned || 0).toLocaleString()}</div>
                            <div class="stat-label">Tokens Earned</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading stats: ${error.message}</div>`;
            }
        }

        // Auto-refresh tasks every 10 seconds
        loadTasks();
        setInterval(loadTasks, 10000);
    </script>
</body>
</html>
